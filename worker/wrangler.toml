name = "oge-ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["enable_request_signal"]
workers_dev = false
preview_urls = false

[observability]
enabled = false

[vars]
# Owner-editable server settings. Live preview and server secrets are still required.
SITE_ORIGIN = "https://exy100.github.io"
AI_ENABLED = "false"
AI_PROVIDER = "routerai"
AI_API_BASE_URL = "https://routerai.ru/api/v1"
# 10 students × 30 AI actions × up to 2 provider attempts per action, per UTC day.
AI_DAILY_REQUEST_LIMIT = "600"
# Owner-selected pair; profiles (Luna high, Claude medium) are in src/model-profiles.ts.
# RouterAI budgets: 4000 tokens, 120 s/attempt; shared source: ../src/core/ai-execution.ts.
# Live local completions checked; public API stays disabled.
# Optional simple-task routing is disabled by default. Set a distinct AI_MODEL_SIMPLE
# and AI_SIMPLE_TASK_NUMBERS to enable it. Each route still allows only two attempts.
AI_SIMPLE_TASK_NUMBERS = ""
AI_MODEL_PRIMARY = "openai/gpt-6-luna"
AI_MODEL_FALLBACK = "anthropic/claude-sonnet-5.5"

[[durable_objects.bindings]]
name = "AI_QUOTA"
class_name = "AiQuota"

[[migrations]]
tag = "v1-ai-quota"
new_sqlite_classes = ["AiQuota"]
