name = "oge-ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["enable_request_signal"]
workers_dev = false
preview_urls = false

[observability]
enabled = false

[vars]
# Owner-editable server settings. Live preview and server secrets are still required.
SITE_ORIGIN = "https://exy100.github.io"
AI_ENABLED = "false"
AI_PROVIDER = "routerai"
AI_API_BASE_URL = "https://routerai.ru/api/v1"
# 10 students × 30 AI actions × up to 2 provider attempts per action, per UTC day.
AI_DAILY_REQUEST_LIMIT = "600"
# Simple short-answer tasks use Luna, with Sonnet as their single fallback.
AI_SIMPLE_TASK_NUMBERS = "1,2,3,4"
AI_MODEL_SIMPLE = "openai/gpt-6-luna"
# All other tasks, practical work and summaries use Sonnet, then Opus.
AI_MODEL_PRIMARY = "anthropic/claude-sonnet-5.5"
AI_MODEL_FALLBACK = "anthropic/claude-opus-5.5"
AI_REASONING_EFFORT = "low"

[[durable_objects.bindings]]
name = "AI_QUOTA"
class_name = "AiQuota"

[[migrations]]
tag = "v1-ai-quota"
new_sqlite_classes = ["AiQuota"]
