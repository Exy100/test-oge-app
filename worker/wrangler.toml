name = "oge-ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["enable_request_signal"]
workers_dev = false
preview_urls = false

[observability]
enabled = false

[vars]
SITE_ORIGIN = "https://exy100.github.io"
AI_ENABLED = "false"
AI_DAILY_REQUEST_LIMIT = "0"

[[durable_objects.bindings]]
name = "AI_QUOTA"
class_name = "AiQuota"

[[migrations]]
tag = "v1-ai-quota"
new_sqlite_classes = ["AiQuota"]
