name: T8.1 production preview
on:
  push:
    branches: [codex/t8-1-recovery]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact PR source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 093f5cb7a197b48c877056e9516ff70f0e147adb
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the production site
        run: npm run build
      - name: Inspect production rendering
        run: |
          node --input-type=module <<'NODE'
          import {spawn} from 'node:child_process';
          import {chromium,expect} from '@playwright/test';
          const server=spawn('npm',['run','preview','--','--host','127.0.0.1','--port','4323'],{stdio:'ignore'});
          let browser;
          try {
            const url='http://127.0.0.1:4323/test-oge-app/materials/i1/bits-bytes/';
            for(let i=0;i<50;i++){if(await fetch(url).then(r=>r.ok).catch(()=>false))break;await new Promise(r=>setTimeout(r,200));}
            browser=await chromium.launch({args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            const page=await browser.newPage({viewport:{width:360,height:800}});
            await page.goto(url);
            const view=page.locator('#bits-and-bytes');
            await view.scrollIntoViewIfNeeded();
            await view.getByLabel('Объёмная схема',{exact:true}).check();
            const stage=view.locator('.three-stage');
            await stage.scrollIntoViewIfNeeded();
            await expect(stage.locator('canvas')).toHaveAttribute('data-three-ready','true');
            console.log('T81_PREVIEW_METRICS:'+JSON.stringify(await stage.evaluate(e=>{const r=e.getBoundingClientRect();return {width:r.width,height:r.height,color:getComputedStyle(e).color,sheets:[...document.styleSheets].map(s=>s.href)};})));
            const png=(await stage.screenshot()).toString('base64');
            console.log('T81_PREVIEW_TOTAL:'+String(Math.ceil(png.length/4000)));
            for(let i=0;i<png.length;i+=4000)console.log('T81_PREVIEW_CHUNK_'+String(i/4000).padStart(4,'0')+':'+png.slice(i,i+4000));
          }finally{await browser?.close();server.kill('SIGTERM');}
          NODE
