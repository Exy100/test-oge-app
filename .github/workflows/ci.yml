name: CI and Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Source, types, build and security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node and npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.0_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            --output "$archive"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/oge-tools"
          tar -xzf "$archive" -C "$RUNNER_TEMP/oge-tools" gitleaks
          echo "$RUNNER_TEMP/oge-tools" >> "$GITHUB_PATH"

      - name: Scan Git history for secrets
        run: gitleaks git --redact --no-banner --log-opts=--all

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify source, types, inventories and build
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm run check:forbidden
          npm run check:coverage
          npm run check:contrast
          npm run build

  unit:
    name: Unit tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node and npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      # A partial shard cannot satisfy the whole-core threshold. The required
      # coverage job merges all three blobs and enforces the unchanged 90% gate.
      - name: Run every test assigned to this shard with coverage
        run: npx vitest run --coverage --shard=${{ matrix.shard }}/3 --coverage.thresholds.lines=0 --reporter=default --reporter=blob --reporter=github-actions --outputFile.blob=.cache/vitest-blobs/shard-${{ matrix.shard }}.json

      - name: Save tests and coverage blob
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unit-shard-${{ matrix.shard }}
          path: .cache/vitest-blobs/shard-${{ matrix.shard }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Complete unit results and coverage
    needs: [unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node and npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Download all three test and coverage blobs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: unit-shard-*
          path: .cache/vitest-blobs
          merge-multiple: true

      - name: Require all shards and enforce the original coverage thresholds
        run: |
          set -euo pipefail
          for shard in 1 2 3; do
            test -s ".cache/vitest-blobs/shard-${shard}.json"
          done
          npx vitest run --merge-reports=.cache/vitest-blobs --coverage

      - name: Save complete coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-reports
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  files:
    name: Independent generated file checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node and npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install LibreOffice and PDF text tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libreoffice-writer libreoffice-calc libreoffice-impress poppler-utils fonts-dejavu-core

      - name: Open generated ODF files and verify content
        run: npm run check:office

      - name: Verify original reading corpora, image formats and file-search answers
        run: python3 scripts/check-exam-files.py

      - name: Run independent Robot family checks
        run: npm run check:robots

      - name: Execute Python references and exported checkers
        run: npm run check:python

      - name: Verify complete variant files, programs and Calc results
        run: npm run check:variants

      - name: Save generated file reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: generated-file-reports
          path: |
            .cache/dataset-sample/
            .cache/presentation-office/
            .cache/document-office/
            .cache/spreadsheet-office/
            .cache/variant-office/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  browsers:
    name: Browsers, accessibility and performance (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node and npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.0_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            --output "$archive"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/oge-tools"
          tar -xzf "$archive" -C "$RUNNER_TEMP/oge-tools" gitleaks
          echo "$RUNNER_TEMP/oge-tools" >> "$GITHUB_PATH"

      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run all browser and accessibility tests
        run: npm run e2e -- --shard=${{ matrix.shard }}/2

      - name: Enforce Lighthouse budgets
        if: matrix.shard == 1
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(node --input-type=module -e "import { chromium } from '@playwright/test'; process.stdout.write(chromium.executablePath());")"
          export CHROME_PATH
          npm run lh

      - name: Publish Lighthouse assertion failures
        if: always() && matrix.shard == 1
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          const assertionsPath = '.lighthouseci/assertion-results.json';
          if (existsSync(assertionsPath)) {
            const escape = (text) => text.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            for (const result of JSON.parse(readFileSync(assertionsPath, 'utf8'))) {
              if (result.passed !== false) continue;
              const details = JSON.stringify({ url: result.url, audit: result.auditId, property: result.auditProperty, assertion: result.name, expected: result.expected, actual: result.actual, values: result.values });
              const level = result.level === 'warn' ? 'warning' : 'error';
              console.log('::' + level + ' title=Lighthouse::' + escape(details));
            }
          }
          NODE

      - name: Scan production files for secrets
        run: gitleaks dir dist --redact --no-banner

      - name: Save test traces and performance reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-reports-${{ matrix.shard }}
          path: |
            test-results/
            .lighthouseci/reports/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the tested Pages build
        if: matrix.shard == 1 && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    name: Publish tested site
    needs: [quality, unit, coverage, files, browsers]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify the Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)"
          if [ "$build_type" != workflow ]; then
            echo "::error title=Pages source must be GitHub Actions::Open https://github.com/$GITHUB_REPOSITORY/settings/pages and select GitHub Actions as Source. The workflow token cannot change this repository setting."
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
